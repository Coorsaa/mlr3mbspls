# All available hooks: https://pre-commit.com/hooks.html
# R specific hooks: https://github.com/lorenzwalthert/precommit
repos:
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3.9021
    hooks:
      # - id: roxygenize
      #   additional_dependencies:
      #   -    checkmate
      #   -    data.table
      #   -    ggplot2
      #   -    mlr3
      #   -    mlr3misc
      #   -    paradox
      #   -    R6
      #   -    utils
      #   -    mlr3spatial
      #   -    blockCV
      #   -    sf
      #   -    sperrorest
      #   -    vctrs
      #   -    CAST
      #   -    ggsci
      # codemeta must be above use-tidy-description when both are used
      - id: use-tidy-description
      - id: readme-rmd-rendered
      - id: parsable-R
      - id: no-browser-statement
      # uncomment after https://github.com/lorenzwalthert/precommit/issues/352
      # - id: deps-in-desc
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: end-of-file-fixer
        # Rcpp::compileAttributes() ends R/RcppExports.R with a blank line.
        exclude: '\.Rd|^R/RcppExports\.R$'
  - repo: local
    hooks:
      - id: mlr-style
        name: Check repository-wide styler.mlr formatting
        entry: Rscript tools/style.R --check
        language: system
        pass_filenames: false
        files: '(^|/)(.*\.(R|Rmd|Rmarkdown|qmd|md)|CITATION)$'
      - id: forbid-to-commit
        name: Don't commit common R artifacts
        entry: Cannot commit .Rhistory, .RData, .Rds or .rds.
        language: fail
        files: '\.Rhistory|\.RData|\.Rds|\.rds$'
        # `exclude: <regex>` to allow committing specific files.

ci:
    autoupdate_schedule: monthly
    # pre-commit.ci cannot install the pinned formatter or build the R hook
    # environment; R CMD check and the styler.mlr job cover these checks.
    skip: [mlr-style, use-tidy-description, readme-rmd-rendered, parsable-R, no-browser-statement]
